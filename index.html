<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Cyrus Sy writes about B2B product marketing, AI, running, and building useful systems. New site coming soon." />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="canonical" href="https://launchpadco.ca/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://launchpadco.ca/" />
    <meta property="og:title" content="Cyrus Sy" />
    <meta property="og:description" content="Writing on B2B product marketing, AI, running, and building useful systems. Coming soon." />
    <meta property="og:image" content="https://launchpadco.ca/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Cyrus Sy · Coming soon</title>
    <style>
      :root {
        --bg: #fcfcfa;
        --ink: #1a1a18;
        --muted: #6b6b66;
        --rule: #e3e3de;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141412;
          --ink: #ecece8;
          --muted: #9a9a94;
          --rule: #2c2c29;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.25rem;
      }
      main {
        max-width: 32rem;
        width: 100%;
        text-align: center;
      }
      .name {
        font-size: 0.8125rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 1.75rem;
        font-weight: 600;
      }
      h1 {
        font-family: Georgia, "Times New Roman", Times, serif;
        font-size: clamp(2.5rem, 9vw, 3.75rem);
        line-height: 1.05;
        font-weight: 400;
        letter-spacing: -0.01em;
        margin: 0 0 1rem;
      }
      .lede {
        font-size: 1.0625rem;
        line-height: 1.6;
        color: var(--muted);
        margin: 0 auto;
        max-width: 24rem;
      }
      .bio {
        font-size: 1rem;
        line-height: 1.6;
        margin: 0 auto 1.25rem;
        max-width: 26rem;
      }
      .links {
        display: flex;
        gap: 1.5rem;
        justify-content: center;
        flex-wrap: wrap;
        margin: 1.75rem 0 0;
        padding: 0;
        list-style: none;
        font-size: 0.9375rem;
      }
      .links a {
        color: var(--ink);
        text-decoration: none;
        border-bottom: 1px solid var(--rule);
        padding-bottom: 2px;
      }
      .links a:hover, .links a:focus-visible { border-color: var(--ink); }
      .rule {
        width: 2.5rem;
        height: 1px;
        background: var(--rule);
        margin: 2rem auto 0;
        border: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="name">Cyrus Sy</p>
      <h1>Coming soon</h1>
      <p class="bio">I'm a B2B product marketer with an engineering background, working in wireless, IoT, and connected fleets.</p>
      <p class="lede">A new site is on the way, with writing on marketing, AI, running, and building useful systems.</p>
      <!-- Email signup goes here once a provider is chosen. -->
      <ul class="links">
        <!-- TODO before merge: add real URLs.
        <li><a href="https://www.linkedin.com/in/YOUR-HANDLE">LinkedIn</a></li>
        <li><a href="mailto:YOU@EXAMPLE.COM">Email</a></li>
        -->
      </ul>
      <hr class="rule" />
    </main>
  </body>
</html>
